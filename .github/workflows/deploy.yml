name: Deploy Worker

# The web app is deployed by Vercel's own Git integration (no workflow needed).
# This workflow deploys the realtime server (Cloudflare Worker) on push to main.
on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual "Run workflow" from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # a missing/invalid credential must fail fast, never hang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
