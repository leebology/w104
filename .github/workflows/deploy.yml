name: Deploy Worker

# The web app is deployed by Vercel's own Git integration (no workflow needed).
# This workflow deploys the realtime server (Cloudflare Worker) on push to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # allow manual "Run workflow" from the Actions tab

jobs:
  # Production: only ships on merge to main (or manual dispatch), never on PRs.
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5 # a missing/invalid credential must fail fast, never hang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Staging: deploys a fully isolated w104-staging Worker on every PR into
  # main, so PR previews (Vercel) have a matching realtime server to talk to.
  # Note: PRs from forks don't receive repository secrets, so this job fails
  # for outside contributors. Acceptable for a private-collaborator repo —
  # revisit if the repo opens up.
  staging:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
