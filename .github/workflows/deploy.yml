name: Deploy Worker

# The web app is deployed by Vercel's own Git integration (no workflow needed).
# This workflow deploys the realtime server (Cloudflare Worker).
#
# Two long-lived branches, one Worker each:
#   main    -> w104          (production)
#   staging -> w104-staging  (staging, at staging.oknameone.com)
#
# Deliberately NOT on pull_request. A PR used to deploy the staging Worker,
# which meant any open PR silently changed what the staging URL was serving —
# unusable once staging is a stable environment people test against. A Worker
# change is now tested by merging it to `staging`, which is what that branch is
# for. Vercel still builds a frontend preview per PR; those point at the
# staging Worker, which is stable precisely because PRs no longer touch it.
#
# Both jobs run typecheck, tests and build before `wrangler deploy`, and that
# is not the same gate CI is. CI answers a *pull request*; this answers the
# push, so it also covers a commit that reached a deployed branch without one —
# a direct push, a merge waved through past a red run, a hotfix at midnight.
# The check and the deploy are one job on purpose: a separate workflow would
# report a failure while the deploy raced ahead regardless, which is exactly
# the arrangement this is here to avoid. Roughly 40 seconds against a deploy
# that people open on their phones the moment it lands.
on:
  push:
    branches: [main, staging]
  workflow_dispatch: # allow manual "Run workflow" from the Actions tab

jobs:
  # Production: only ships from main.
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5 # a missing/invalid credential must fail fast, never hang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Nothing ships that does not pass. Redundant against CI on the ordinary
      # path — the merge that produced this push was already checked — and that
      # is fine: the case it exists for is the push that was not.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Staging: a fully isolated w104-staging Worker with its own Durable Object
  # storage, so nothing here can touch production room state. Tracks the
  # `staging` branch, which is what makes the staging URL stable enough to hand
  # to a room full of people testing on their phones.
  staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The same three, for the same reason — and this is the one that bites
      # most often, since a PR into `staging` can be merged without waiting for
      # anything unless the branch is protected.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
